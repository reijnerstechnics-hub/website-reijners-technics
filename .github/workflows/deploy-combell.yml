
name: Deploy Reijners Technics to Combell

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: combell-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Websitecode ophalen
        uses: actions/checkout@v4

      - name: SSH instellen en server controleren
        env:
          SSH_KEY: ${{ secrets.COMBELL_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/combell_key
          chmod 600 ~/.ssh/combell_key

          ssh-keyscan -T 15 -t rsa \
            ssh.reijnerstechnics.be > ~/.ssh/known_hosts

          ACTUAL=$(ssh-keygen -lf ~/.ssh/known_hosts \
            -E sha256 | awk '{print $2}')
            echo "Gevonden fingerprint: $ACTUAL"

          EXPECTED="SHA256:zR5nBZtK9P835081KX/iAqhdI4+4HKv/6C/ga2M3S5U"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "SSH-hostfingerprint komt niet overeen!"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts

      - name: Publicatiebestanden voorbereiden
        run: |
          set -e
          mkdir -p publish

          cp index.html 404.html publish/
          cp favicon.ico robots.txt publish/
          cp sitemap.xml site.webmanifest publish/

          cp -a css js assets publish/

          test -s publish/index.html

      - name: Bestanden naar Combell uploaden
        run: |
          set -e
          SSH_OPTS="-i $HOME/.ssh/combell_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          scp $SSH_OPTS -r publish/. \
            reijnerstechnicsbe@ssh.reijnerstechnics.be:/data/sites/web/reijnerstechnicsbe/www/

      - name: Deployment afgerond
        run: |
          echo "Websitebestanden verzonden naar Combell."
